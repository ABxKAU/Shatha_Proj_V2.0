<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>السوبر ماركت</title>
<style>
:root{--g:#16a34a;--gd:#15803d;--bg:#f3f6f4;--tx:#1f2937;--mu:#6b7280;--r:16px}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
.bar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:#fff;box-shadow:0 2px 10px #0001;flex-wrap:wrap}
.brand{background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:18px;font-weight:700;cursor:pointer}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:#ecfdf5;border-radius:20px;padding:8px 14px;font-size:15px}
.cartbtn{background:#fff;border:2px solid var(--g);border-radius:12px;padding:8px 14px;font-size:18px;cursor:pointer}
.badge{background:var(--g);color:#fff;border-radius:10px;padding:1px 8px;font-size:13px;margin-inline-start:4px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
.card{background:#fff;border-radius:var(--r);padding:24px;box-shadow:0 4px 18px #0001;margin-bottom:16px}
h1,h2{margin-top:0}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:17px;cursor:pointer;margin:6px 4px;font-family:inherit}
.btn:hover{background:var(--gd)} .btn.sec{background:#e5e7eb;color:var(--tx)}
.btn:disabled{background:#d1d5db;color:#9ca3af;cursor:not-allowed}
.center{text-align:center}
label{display:block;margin:14px 0;font-weight:600}
input[type=text],select{width:100%;margin-top:6px;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
.q{padding:14px 0;border-bottom:1px solid #eee}
.opt{display:block;font-weight:400;margin:8px 0;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;cursor:pointer}
.opt:hover{background:#f0fdf4}
.qimg{width:100%;max-width:420px;border-radius:12px;display:block;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.cat{background:#fff;border-radius:var(--r);overflow:hidden;text-align:center;cursor:pointer;box-shadow:0 4px 14px #0001;border:2px solid transparent;transition:.15s}
.cat:hover{transform:translateY(-3px);border-color:var(--g)}
.cat.done{border-color:var(--g);background:#f0fdf4}
.cat img{width:100%;height:150px;object-fit:cover;display:block;background:#e8f5ec}
.cat h3{margin:10px 8px 4px;font-size:16px}
.cat small{display:block;color:var(--gd);padding:0 8px 10px}
.cat .sp{height:10px}
.dis{opacity:.45;pointer-events:none;filter:grayscale(1)}
.prod{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 4px 14px #0001;display:flex;flex-direction:column;border:2px solid transparent}
.prod.sel{border-color:var(--g)}
.prod.off{opacity:.5}
.pimg{height:170px;background:#fff;display:flex;align-items:center;justify-content:center}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.pb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.qty{color:var(--mu);font-size:14px}
.price{font-size:20px;font-weight:700;color:var(--gd)}
.prod .btn{margin:6px 0 0;width:100%;padding:10px}
.crow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #eee}
.crow .pimg{width:84px;height:68px;flex:none}
.crow .nm{flex:1}
.x{background:#fee2e2;color:#b91c1c;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit}
.sum{display:flex;justify-content:space-between;font-size:18px;padding:8px 0}
.overlay{position:fixed;inset:0;background:#0006;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:var(--r);padding:28px;max-width:440px;text-align:center}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:20px;z-index:60}
.err{color:#b91c1c}
.back{background:none;border:0;color:var(--gd);font-size:16px;cursor:pointer;margin-bottom:10px;font-family:inherit}
</style></head>
<body>
<div id="app"></div>
<script src="catalog.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzuFfXTZ-ET-AzyjvJOxf7Mq8fykui1gpF0dqOsjzMjEqwNCw6AlSyX7q3VcOUIXqTF/exec';
const BUDGET = 150;
const MAX_ITEMS = 3;

const T = {
 brand:'السوبر ماركت', yes:'نعم', no:'لا', next:'التالي', loading:'يرجى الانتظار...',
 welcomeTitle:'مرحباً بك', welcomeText:'هنا نص الموافقة على المشاركة (استبدله بنصك). هل توافق على المشاركة في هذه الدراسة؟',
 declinedTitle:'شكراً لك', declinedText:'تم إنهاء المشاركة. يمكنك إغلاق هذه الصفحة.',
 profileTitle:'المعلومات الشخصية', introTitle:'المتجر الإلكتروني',
 introText:'ستقوم بالتسوق من المتجر. اختر ' + MAX_ITEMS + ' منتجات من أقسام مختلفة (منتج واحد من كل قسم) ضمن ميزانية ' + BUDGET + ' ريال. سيبدأ المؤقت بعد الموافقة. هل توافق على البدء؟',
 budget:'المتبقي', sar:'ر.س', cartTitle:'سلة التسوق', cartEmpty:'السلة فارغة', remove:'إلغاء',
 total:'المجموع', remaining:'المتبقي من الميزانية', finish:'انتهت مهمة التسوق',
 finishHint:'اختر ' + MAX_ITEMS + ' منتجات من أقسام مختلفة لإنهاء المهمة.',
 add:'أضف إلى السلة', inCart:'في السلة - إلغاء', locked:'تم الاختيار من هذا القسم', over:'يتجاوز الميزانية', full:'اكتمل العدد',
 backCats:'العودة للأقسام', pickCat:'اختر القسم', surveyTitle:'الاستبيان الأخير', submit:'إرسال',
 thanksTitle:'شكراً لمشاركتك', thanksText:'تم حفظ إجاباتك بنجاح.', err:'حدث خطأ، حاول مرة أخرى',
 select:'اختر...', keepCart:'متابعة التسوق'
};

const PROFILE = [
 {k:'age',type:'select',label:'العمر',opts:['18-24','25-34','35-44','45+']},
 {k:'gender',type:'select',label:'الجنس',opts:['ذكر','أنثى']},
 {k:'city',type:'text',label:'المدينة'},
 {k:'edu',type:'select',label:'المستوى التعليمي',opts:['ثانوي','بكالوريوس','دراسات عليا']},
 {k:'freq',type:'select',label:'عدد مرات التسوق أسبوعياً',opts:['1-2','3-4','5+']}
];
const LIK = ['موافق بشدة','موافق','محايد','غير موافق','غير موافق بشدة'];
const SURVEY = [
 {q:'سؤال 1 (نص مؤقت): كان المتجر سهل الاستخدام',opts:LIK},
 {q:'سؤال 2 (نص مؤقت): الأسعار كانت مناسبة',opts:LIK},
 {q:'سؤال 3 (نص مؤقت): وجدت المنتجات التي أريدها',opts:LIK},
 {q:'سؤال 4 (نص مؤقت): الوقت كان كافياً',opts:LIK},
 {q:'سؤال 5 (نص مؤقت): سأتسوق من هذا المتجر مجدداً',opts:LIK},
 {q:'سؤال 6 (نص مؤقت): ماذا ترى في الصورة؟',img:'',opts:['الخيار أ','الخيار ب','الخيار ج','الخيار د']}
];

const S = {screen:'consent',profile:{},ans:[],group:0,token:'',cart:[],cat:null,
           started:false,finished:false,t0:0,seconds:0,busy:false,err:''};
const items = () => CATALOG[S.group] || [];
const get = id => items().find(i => i.id === id);
const sec = id => SECTIONS.find(s => s.id === id);
const r2 = n => Math.round(n * 100) / 100;
const money = n => r2(n).toFixed(2);
const total = () => r2(S.cart.reduce((s, id) => s + get(id).price, 0));
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

function go(s){ S.screen = s; S.err = ''; render(); window.scrollTo(0, 0); }
function toast(m){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2000); }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function header(){
  return `<header class="bar">
   <button class="brand" onclick="goCats()">🛒 ${T.brand}</button>
   <div class="stats">
    <span class="chip">⏱ <b id="timer">00:00</b></span>
    <span class="chip">💰 ${T.budget}: <b>${money(BUDGET - total())}</b> ${T.sar}</span>
    <button class="cartbtn" onclick="openCart()">🧺<span class="badge">${S.cart.length}/${MAX_ITEMS}</span></button>
   </div></header>`;
}
function goCats(){ if(S.started) go('cats'); }
function openCart(){ if(S.started && !S.finished) go('cart'); }

const SCREENS = {
 consent(){ return `<main><div class="card center"><h1>${T.welcomeTitle}</h1><p>${T.welcomeText}</p>
   <button class="btn" onclick="go('profile')">${T.yes}</button>
   <button class="btn sec" onclick="go('declined')">${T.no}</button></div></main>`; },
 declined(){ return `<main><div class="card center"><h1>${T.declinedTitle}</h1><p>${T.declinedText}</p></div></main>`; },
 profile(){
   const f = PROFILE.map(f => {
     const v = S.profile[f.k] || '';
     if(f.type === 'text') return `<label>${f.label}<input type="text" value="${esc(v)}" oninput="setP('${f.k}',this.value)"></label>`;
     return `<label>${f.label}<select onchange="setP('${f.k}',this.value)"><option value="">${T.select}</option>
       ${f.opts.map(o => `<option value="${o}" ${v === o ? 'selected' : ''}>${o}</option>`).join('')}</select></label>`;
   }).join('');
   return `<main><div class="card"><h2>${T.profileTitle}</h2>${f}<p class="err">${S.err}</p>
     <div class="center"><button id="nextBtn" class="btn" onclick="toStore()" disabled>${T.next}</button></div></div></main>`;
 },
 intro(){
   return header() + `<main><div class="grid dis">${SECTIONS.map(c => `<div class="cat"><img src="${c.img}"><h3>${c.title}</h3><div class="sp"></div></div>`).join('')}</div></main>
   <div class="overlay"><div class="modal"><h2>${T.introTitle}</h2><p>${T.introText}</p>
   <button class="btn" onclick="startShop()">${T.yes}</button>
   <button class="btn sec" onclick="go('consent')">${T.no}</button></div></div>`;
 },
 cats(){
   return header() + `<main><h2>${T.pickCat}</h2><div class="grid">${SECTIONS.map(c => {
     const sel = S.cart.map(get).find(i => i.sec === c.id);
     return `<div class="cat ${sel ? 'done' : ''}" onclick="openCat('${c.id}')"><img src="${c.img}" loading="lazy"><h3>${c.title}</h3>
       ${sel ? `<small>✓ ${sel.name}</small>` : '<div class="sp"></div>'}</div>`;
   }).join('')}</div></main>`;
 },
 products(){
   const c = sec(S.cat);
   const cards = items().filter(i => i.sec === S.cat).map(it => {
     const inC = S.cart.includes(it.id);
     const taken = !inC && S.cart.some(id => get(id).sec === it.sec);
     const over = !inC && !taken && r2(total() + it.price) > BUDGET;
     const full = !inC && !taken && !over && S.cart.length >= MAX_ITEMS;
     const off = taken || over || full;
     const label = inC ? T.inCart : taken ? T.locked : over ? T.over : full ? T.full : T.add;
     return `<div class="prod ${inC ? 'sel' : ''} ${off ? 'off' : ''}"><div class="pimg"><img src="${it.img}" loading="lazy"></div>
       <div class="pb"><b>${it.name}</b><span class="qty">${it.qty}</span><span class="price">${money(it.price)} ${T.sar}</span>
       <button class="btn ${inC ? 'sec' : ''}" ${off ? 'disabled' : ''} onclick="toggleItem('${it.id}')">${label}</button></div></div>`;
   }).join('');
   return header() + `<main><button class="back" onclick="go('cats')">→ ${T.backCats}</button><h2>${c.title}</h2><div class="grid">${cards}</div></main>`;
 },
 cart(){
   const rows = S.cart.map(id => { const it = get(id); return `<div class="crow"><div class="pimg"><img src="${it.img}"></div>
     <div class="nm"><b>${it.name}</b><br><small>${it.qty} - ${sec(it.sec).title}</small></div>
     <b>${money(it.price)} ${T.sar}</b><button class="x" onclick="toggleItem('${id}')">${T.remove}</button></div>`; }).join('');
   const ready = S.cart.length === MAX_ITEMS;
   return header() + `<main><div class="card"><h2>🧺 ${T.cartTitle}</h2>${rows || `<p>${T.cartEmpty}</p>`}
     <div class="sum"><span>${T.total}</span><b>${money(total())} ${T.sar}</b></div>
     <div class="sum"><span>${T.remaining}</span><b>${money(BUDGET - total())} ${T.sar}</b></div>
     ${ready ? '' : `<p style="color:var(--mu)">${T.finishHint}</p>`}
     <div class="center"><button class="btn sec" onclick="go('cats')">${T.keepCart}</button>
     <button class="btn" ${ready ? '' : 'disabled'} onclick="finishShop()">${T.finish}</button></div></div></main>`;
 },
 survey(){
   const qs = SURVEY.map((q, i) => `<div class="q"><b>${q.q}</b>${q.img ? `<img class="qimg" src="${q.img}">` : ''}
     ${q.opts.map((o, j) => `<label class="opt"><input type="radio" name="q${i}" ${S.ans[i] === j ? 'checked' : ''} onchange="setA(${i},${j})"> ${o}</label>`).join('')}</div>`).join('');
   return `<main><div class="card"><h2>${T.surveyTitle}</h2>${qs}<p class="err">${S.err}</p>
     <div class="center"><button id="nextBtn" class="btn" onclick="submitAll()" disabled>${T.submit}</button></div></div></main>`;
 },
 done(){ return `<main><div class="card center"><h1>✅ ${T.thanksTitle}</h1><p>${T.thanksText}</p></div></main>`; }
};

function render(){
  document.getElementById('app').innerHTML = SCREENS[S.screen]();
  refreshNext(); tick();
}
function setP(k, v){ S.profile[k] = v; refreshNext(); }
function setA(i, j){ S.ans[i] = j; refreshNext(); }
function refreshNext(){
  const b = document.getElementById('nextBtn'); if(!b) return;
  let ok = false;
  if(S.screen === 'profile') ok = PROFILE.every(f => (S.profile[f.k] || '').trim() !== '');
  if(S.screen === 'survey') ok = SURVEY.every((q, i) => S.ans[i] !== undefined);
  b.disabled = !ok || S.busy;
}

async function api(body){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)});
  const j = await r.json();
  if(j.status !== 'ok') throw new Error(j.msg || 'error');
  return j;
}

async function toStore(){
  S.busy = true; const b = document.getElementById('nextBtn'); b.disabled = true; b.textContent = T.loading;
  try{
    const j = await api({action:'assign', token:sessionStorage.getItem('mk_token') || ''});
    S.token = j.token; S.group = j.group; sessionStorage.setItem('mk_token', j.token);
    S.busy = false; go('intro');
  }catch(e){ S.busy = false; S.err = T.err; render(); }
}

function startShop(){ S.started = true; S.t0 = Date.now(); go('cats'); }
function openCat(id){ S.cat = id; go('products'); }

function toggleItem(id){
  if(S.cart.includes(id)){ S.cart = S.cart.filter(x => x !== id); render(); return; }
  S.cart.push(id);
  if(S.cart.length === MAX_ITEMS) go('cart'); else { toast('✓ ' + get(id).name); render(); }
}
function finishShop(){
  S.finished = true; S.seconds = Math.floor((Date.now() - S.t0) / 1000); go('survey');
}
function tick(){
  if(!S.started || S.finished) return;
  const e = document.getElementById('timer');
  if(e) e.textContent = fmt(Math.floor((Date.now() - S.t0) / 1000));
}
setInterval(tick, 500);

async function submitAll(){
  S.busy = true; const b = document.getElementById('nextBtn'); b.disabled = true; b.textContent = T.loading;
  const its = S.cart.map(id => { const it = get(id); return {cat:sec(it.sec).title, name:it.name + ' - ' + it.qty, price:it.price}; });
  const payload = {action:'submit', token:S.token, group:S.group,
    profile:PROFILE.map(f => (S.profile[f.k] || '').trim()),
    items:its, total:total(), seconds:S.seconds, timedOut:false,
    survey:SURVEY.map((q, i) => q.opts[S.ans[i]])};
  try{ await api(payload); sessionStorage.removeItem('mk_token'); S.busy = false; go('done'); }
  catch(e){ S.busy = false; S.err = T.err; render(); }
}

render();
</script>
</body></html>
